<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B33">
<title>Shared location — Lighthouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#071226;
    --navy:#0B1B33;
    --navy-light:#12294D;
    --beam:#FFC24B;
    --beam-soft:#FFE3A3;
    --white:#FFFFFF;
    --off:#EAF0F9;
    --muted:#9FB0CC;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(120% 100% at 50% 0%, var(--navy-light) 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color:var(--white);
    min-height:100vh;
  }
  #wrap{
    max-width:480px; margin:0 auto;
    padding:calc(var(--safe-top) + 22px) 22px calc(var(--safe-bottom) + 32px);
  }
  .brand-row{ display:flex; align-items:center; gap:8px; margin-bottom:22px; }
  .brand-icon{ font-size:20px; }
  .brand-wordmark{ font-family:"Fraunces","Playfair Display",Georgia,serif; font-size:20px; font-weight:600; }

  .loc-title{ font-size:21px; font-weight:800; margin-bottom:2px; }
  .loc-time{ font-size:13px; color:var(--muted); margin-bottom:16px; }

  .map-frame{
    width:100%; aspect-ratio:1/1; border-radius:20px; overflow:hidden;
    border:1px solid rgba(255,255,255,.1); margin-bottom:18px; background:var(--navy-light);
  }
  .map-frame iframe{ width:100%; height:100%; border:0; display:block; }

  .open-maps-link{
    display:block; text-align:center; color:var(--muted); font-size:13px;
    text-decoration:underline; margin:-10px 0 18px;
  }

  .cta-card{
    background:rgba(255,194,75,.1); border:1px solid rgba(255,194,75,.28);
    border-radius:18px; padding:20px; text-align:center;
  }
  .cta-card p{ font-size:14px; color:var(--beam-soft); line-height:1.5; margin:0 0 16px; }
  .cta-btn{
    display:inline-block;
    background:linear-gradient(180deg, var(--beam) 0%, #E8A730 100%);
    color:#231400; font-weight:800; text-decoration:none;
    padding:14px 28px; border-radius:999px; font-size:15px;
  }

  .fallback{ text-align:center; padding:50px 10px 30px; }
  .fallback .fb-emoji{ font-size:40px; margin-bottom:12px; }
  .fallback .fb-title{ font-weight:700; font-size:16px; margin-bottom:8px; }
  .fallback .fb-sub{ color:var(--muted); font-size:14px; margin-bottom:22px; line-height:1.5; }

  .disclaimer{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:22px; line-height:1.5; }
</style>
</head>
<body>
<div id="wrap">
  <div class="brand-row">
    <span class="brand-icon">🗼</span>
    <span class="brand-wordmark">Lighthouse</span>
  </div>

  <div id="content"></div>

  <div class="disclaimer">This is a one-time location snapshot, not a live tracker. It reflects where this person was at the moment they shared it — it will not update after that.</div>
</div>

<script>
function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

const params = new URLSearchParams(window.location.search);
const lat = parseFloat(params.get("lat"));
const lng = parseFloat(params.get("lng"));
const t = params.get("t") || "";
const content = document.getElementById("content");

if(!isNaN(lat) && !isNaN(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180){
  const mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
  content.innerHTML = `
    <div class="loc-title">📍 A shared location</div>
    <div class="loc-time">${t ? "As of " + escapeHtml(t) : ""}</div>
    <div class="map-frame">
      <iframe src="https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <a class="open-maps-link" href="${mapsUrl}" target="_blank" rel="noopener">Open in Google Maps →</a>
    <div class="cta-card">
      <p>This was shared using <b>Lighthouse</b> — an app that shows local emergency numbers anywhere in the world, and lets you share your location in one tap.</p>
      <a class="cta-btn" href="./index.html">Get Lighthouse</a>
    </div>
  `;
} else {
  content.innerHTML = `
    <div class="fallback">
      <div class="fb-emoji">🗺️</div>
      <div class="fb-title">No location attached to this link</div>
      <div class="fb-sub">This link is missing its coordinates. Ask them to send it again from Lighthouse.</div>
      <a class="cta-btn" href="./index.html">Get Lighthouse</a>
    </div>
  `;
}
</script>
</body>
</html>
